<script>
// Bestehender Code bleibt
document.getElementById('menuButton').addEventListener('click', function () {
  document.getElementById('menuList').classList.toggle('show');
});

// NEU: Klick außerhalb des Menüs schließt es
document.addEventListener('click', function(event) {
  const menuButton = document.getElementById('menuButton');
  const menuList = document.getElementById('menuList');
  
  // Prüfe, ob Klick außerhalb von Menü-Button UND Menü-Liste war
  if (!menuButton.contains(event.target) && !menuList.contains(event.target)) {
    menuList.classList.remove('show');
  }
});
    function toggleZoom(img) {
      img.classList.toggle('zoomed');
      
      // Alle anderen Bilder zurücksetzen (optional)
      document.querySelectorAll('.gallery img').forEach(otherImg => {
        if (otherImg !== img) {
          otherImg.classList.remove('zoomed');
        }
      });
    }
  </script>
